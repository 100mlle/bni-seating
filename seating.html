<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI 週會座位圖</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

:root {
  --orange:   #f97316;
  --orange2:  #ea580c;
  --orange3:  #fb923c;
  --orangeL:  #fff7ed;
  --orangeM:  #ffedd5;
  --shadow-sm: 0 2px 8px rgba(249,115,22,.12);
  --shadow-md: 0 4px 20px rgba(249,115,22,.18);
  --shadow-lg: 0 8px 32px rgba(249,115,22,.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background: #f8fafc;
  background-image:
    radial-gradient(ellipse at 0% 0%, rgba(251,146,60,.12) 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(249,115,22,.08) 0%, transparent 50%);
  color: #1e293b;
  padding: 12px;
  min-width: 980px;
  min-height: 100vh;
  width: 100vw;
  overflow-x: hidden;
}

/* ── TOP BAR ── */
.topbar {
  background: linear-gradient(135deg, var(--orange2) 0%, var(--orange) 60%, var(--orange3) 100%);
  border-radius: 16px;
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.2);
  padding: 8px 14px;
  display: flex; align-items: center; gap: 7px; flex-wrap: nowrap;
  margin-bottom: 16px;
}
.topbar h1 {
  font-size: 1.15rem; font-weight: 900; color: white;
  letter-spacing: .04em; white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.week-chip {
  background: rgba(255,255,255,.22); color: white;
  border: 1px solid rgba(255,255,255,.35);
  padding: 4px 14px; border-radius: 20px; font-size: .8rem; font-weight: 700;
  backdrop-filter: blur(4px);
}

.ctrl { display: flex; align-items: center; gap: 5px; }
.ctrl-label { font-size: .75rem; color: rgba(255,255,255,.85); white-space: nowrap; font-weight: 600; }

/* 來賓滑桿區 */
.slider-wrap { display: flex; flex-direction: column; gap: 0; }
.slider-row  { display: flex; align-items: center; gap: 8px; }
.ctrl input[type=range] {
  width: 110px; accent-color: white; cursor: pointer;
  height: 4px;
}
.slider-ticks {
  display: flex; justify-content: space-between;
  width: 160px; padding: 0 1px;
  font-size: .58rem; color: rgba(255,255,255,.75); font-weight: 700;
  margin-top: 2px; letter-spacing: 0;
}
.ctrl input[type=number] {
  width: 58px; padding: 4px 8px;
  background: rgba(255,255,255,.25); border: 1.5px solid rgba(255,255,255,.4);
  border-radius: 8px; font-size: .9rem; text-align: center;
  color: white; font-weight: 700;
}
.ctrl input[type=number]::placeholder { color: rgba(255,255,255,.6); }
.guest-badge {
  background: white; color: var(--orange2);
  font-weight: 900; font-size: .95rem; padding: 2px 10px;
  border-radius: 20px; min-width: 32px; text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.btn {
  padding: 7px 14px; border: none; border-radius: 10px;
  font-size: .82rem; font-weight: 700; cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.btn-shuffle {
  background: white; color: var(--orange2);
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}
.btn-shuffle:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.btn-print {
  background: rgba(255,255,255,.18); color: white;
  border: 1.5px solid rgba(255,255,255,.45);
}
.btn-print:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }
.btn-pin {
  background: rgba(255,255,255,.18); color: white;
  border: 1.5px solid rgba(255,255,255,.45);
}
.btn-pin:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }
.btn-pin.active {
  background: #fbbf24; color: #7c2d12;
  border-color: #fbbf24; font-weight: 800;
}
.ml-auto { margin-left: auto; display: flex; gap: 6px; }
.size-btn {
  padding: 5px 11px; border-radius: 8px; font-size: .78rem; font-weight: 700;
  cursor: pointer; background: rgba(255,255,255,.18); color: rgba(255,255,255,.85);
  border: 1.5px solid rgba(255,255,255,.35); transition: all .15s; user-select: none;
}
.size-btn:hover { background: rgba(255,255,255,.28); }

/* ── LEGEND ── */
.legend {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  padding: 7px 14px;
  background: white;
  border: 1.5px solid #fed7aa;
  border-radius: 12px; margin-bottom: 10px;
  font-size: .78rem; color: #6b7280;
  box-shadow: var(--shadow-sm);
}
.legend-item { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.legend-dot {
  width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid rgba(0,0,0,.1);
}

/* ── FLOOR ── */
.floor { display: flex; gap: 20px; align-items: flex-start; }

/* 資訊/電音 */
.info-col {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; padding-top: 65px; flex-shrink: 0;
}
.info-desk {
  background: linear-gradient(160deg, #f97316, #c2410c);
  border: 2px solid #fdba74;
  border-radius: 8px; width: 62px; height: 150px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-md);
}
.info-desk span {
  font-size: .65rem; font-weight: 800; color: white;
  writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 5px;
  text-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.info-oval {
  width: 100px; height: 48px; border-radius: 12px;
  background: linear-gradient(145deg, var(--orange), var(--orange2));
  border: 2.5px solid #fdba74;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 800; color: white;
  box-shadow: 0 2px 10px rgba(249,115,22,.4);
  position: relative; overflow: hidden;
}
.info-oval::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 48%;
  background: linear-gradient(180deg, rgba(255,255,255,.22), transparent);
  border-radius: 11px 11px 0 0; pointer-events: none;
}

/* ── MAIN AREA ── */
.main-area { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.special-row { display: flex; gap: 10px; justify-content: center; }
.tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.bottom-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

/* ── TABLE CARD ── */
.table-card {
  background: white;
  border: 1.5px solid #e2e8f0;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  padding: 6px 6px 6px;
  transition: box-shadow .2s, transform .15s;
}
.table-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(249,115,22,.18), 0 2px 8px rgba(0,0,0,.06);
  border-color: #fdba74;
}
.table-card-label {
  text-align: center; font-size: .62rem; font-weight: 700;
  letter-spacing: .08em; color: #94a3b8;
  margin-bottom: 5px; text-transform: uppercase;
}

/* ── TABLE INNER ── */
.table-inner { display: flex; align-items: flex-start; gap: 7px; justify-content: center; }
.t-col { display: flex; flex-direction: column; gap: 4px; align-items: center; }

/* 桌面 - 溫暖木紋 */
.table-rect {
  background:
    repeating-linear-gradient(
      90deg, transparent, transparent 16px,
      rgba(0,0,0,.03) 16px, rgba(0,0,0,.03) 17px
    ),
    linear-gradient(170deg, #c2833a, #a0522d, #b5692e, #8b4513);
  border: 2px solid #8b4513;
  border-radius: 10px; flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(139,69,19,.3), inset 0 1px 0 rgba(255,255,255,.15);
  position: relative; overflow: hidden;
}
.table-rect::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,.12) 0%, transparent 55%);
  pointer-events: none;
}
.table-rect.sz-sm { width: 140px; height: 72px; }
.table-rect.sz-md { width: 160px; height: 160px; }
.table-rect.proxy {
  background: linear-gradient(160deg, #f1f5f9, #e2e8f0);
  border-color: #cbd5e1;
  box-shadow: none;
}

/* ── SEAT OVAL ── */
.oval {
  width: 130px; height: 62px; border-radius: 14px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; border: 2px solid transparent;
  padding: 0 4px; cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  user-select: none; position: relative; overflow: hidden;
}
.oval::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 45%;
  background: linear-gradient(180deg, rgba(255,255,255,.28), transparent);
  border-radius: 12px 12px 0 0; pointer-events: none;
}
.oval:hover { transform: scale(1.06); }
.oval .n {
  font-size: 1.32rem; font-weight: 900; line-height: 1.15;
  letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.oval .r  { font-size: .68rem; opacity: .88; margin-top: 1px; font-weight: 700; letter-spacing: .03em; }

/* 指定位置：選取狀態（一般座位 & info oval） */
.oval.selected, .info-oval.selected {
  outline: 3px solid #fff;
  box-shadow: 0 0 0 5px rgba(249,115,22,.85), 0 4px 16px rgba(249,115,22,.6) !important;
  transform: scale(1.1);
  z-index: 10;
  animation: none !important;
}

/* 夥伴 - 翠綠（白字，高對比） */
.c-member {
  background: linear-gradient(145deg, #22c55e, #15803d);
  border-color: #4ade80;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(21,128,61,.4);
}
.c-member:hover { box-shadow: 0 4px 18px rgba(21,128,61,.6); }

/* 固定幹部 - 深綠（白字） */
.c-pinned {
  background: linear-gradient(145deg, #166534, #052e16);
  border-color: #15803d;
  color: #bbf7d0;
  box-shadow: 0 2px 8px rgba(5,46,22,.5);
}
.c-pinned:hover { box-shadow: 0 4px 18px rgba(5,46,22,.7); }

/* 幹部 - 橙紅（白字） */
.c-special {
  background: linear-gradient(145deg, var(--orange3), var(--orange2));
  border-color: #fdba74;
  color: white;
  box-shadow: 0 2px 10px rgba(249,115,22,.45);
}
.c-special:hover { box-shadow: 0 4px 18px rgba(249,115,22,.6); }

/* 來賓 - 金黃（深棕字，對比清晰） */
.c-guest {
  background: linear-gradient(145deg, #fcd34d, #f59e0b);
  border-color: #fef08a;
  color: #451a03;
  box-shadow: 0 2px 10px rgba(245,158,11,.5);
  animation: pulse-guest 2.5s ease-in-out infinite;
}
.c-guest:hover { box-shadow: 0 4px 18px rgba(245,158,11,.7); }
@keyframes pulse-guest {
  0%,100% { box-shadow: 0 2px 10px rgba(245,158,11,.5); }
  50%      { box-shadow: 0 3px 18px rgba(245,158,11,.85), 0 0 0 4px rgba(254,240,138,.35); }
}

/* 榮譽 - 深紅橙（白字） */
.c-orange {
  background: linear-gradient(145deg, #dc2626, #9a3412);
  border-color: var(--orange3);
  color: white;
  box-shadow: 0 2px 10px rgba(220,38,38,.4);
}

/* 代理人 - 淡灰 */
.c-proxy {
  background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
  border-color: #cbd5e1; color: #94a3b8;
}
/* 傳麥手 - 淺紫色 */
.c-mic {
  background: linear-gradient(145deg, #c084fc, #9333ea);
  border-color: #d8b4fe; color: #ffffff;
  box-shadow: 0 2px 8px rgba(147,51,234,.35);
}
.c-mic:hover { box-shadow: 0 4px 18px rgba(147,51,234,.55); }
.table-card.t-mic { border-top: 3px solid #9333ea; background: linear-gradient(to bottom, #faf5ff, white); }
.c-empty { background: transparent; border: 2px dashed #e2e8f0; }
/* oval 外層包裹（雙按鈕用） */
.oval-wrap { position: relative; display: inline-flex; }
.oval-action-btn {
  position: absolute; top: -5px;
  width: 17px; height: 17px; border-radius: 50%;
  border: 1.5px solid white; font-size: .62rem; font-weight: 900;
  cursor: pointer; display: none;
  align-items: center; justify-content: center;
  z-index: 20; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  line-height: 1; padding: 0; color: white;
}
.oval-wrap:hover .oval-action-btn { display: flex; }
.del-btn   { right: -5px; background: #ef4444; } /* ✕ 純刪除（空格） */
.proxy-btn { left:  -5px; background: #f97316; } /* ✋ 移至代理名單 */

/* 代理人面板 tag 選取狀態 */
.proxy-tag.selected {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  border-color: #fde68a; color: #451a03;
  box-shadow: 0 0 0 2px rgba(249,115,22,.6);
}

/* 可互換空格 */
.c-slot-empty {
  background: transparent;
  border: 2px dashed #cbd5e1;
  opacity: .55;
  transition: opacity .15s, border-color .15s;
}
.c-slot-empty:hover { opacity: 1; border-color: #f97316; }
.c-slot-empty.selected { opacity: 1; }


/* ── SPECIAL TABLE ACCENTS ── */
.table-card.t-president { border-top: 3px solid var(--orange); background: linear-gradient(to bottom, #fff7ed, white); }
.table-card.t-officer   { border-top: 3px solid var(--orange3); background: linear-gradient(to bottom, #fff7ed, white); }
.table-card.t-honor     { border-top: 3px solid #d97706; }
.table-card.t-proxy     { border-top: 3px solid #cbd5e1; opacity: .75; }

/* 可編輯 oval */
.editable-oval { cursor: pointer; }
.editable-oval:hover { opacity: .85; outline: 2px dashed rgba(255,255,255,.6); outline-offset: 2px; }
.editable-oval .edit-hint {
  position: absolute; bottom: 2px; right: 4px;
  font-size: .42rem; opacity: .55; font-weight: 600;
}

/* ── 成員選擇下拉 ── */
#memberPicker {
  position: fixed; z-index: 999;
  background: white; border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,.22);
  border: 1.5px solid #e2e8f0;
  padding: 6px; min-width: 160px; max-height: 280px;
  overflow-y: auto; display: none; flex-direction: column; gap: 2px;
}
#memberPicker .mp-title {
  font-size: .68rem; font-weight: 800; color: #64748b;
  padding: 2px 6px 6px; border-bottom: 1px solid #f1f5f9; margin-bottom: 2px;
}
#memberPicker .mp-item {
  padding: 6px 10px; border-radius: 7px; cursor: pointer;
  font-size: .8rem; font-weight: 700; color: #1e293b;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
#memberPicker .mp-item:hover { background: #f1f5f9; }
#memberPicker .mp-role { font-size: .65rem; color: #94a3b8; font-weight: 500; }
#memberPicker .mp-cancel {
  padding: 5px 10px; border-radius: 7px; cursor: pointer;
  font-size: .75rem; color: #ef4444; font-weight: 700; text-align: center;
  border-top: 1px solid #f1f5f9; margin-top: 2px;
}
#memberPicker .mp-cancel:hover { background: #fef2f2; }

/* ── 代理人面板 ── */
.proxy-panel {
  display: none;
}
.proxy-panel-title {
  font-size: .68rem; font-weight: 800; color: #dc2626;
  text-align: center; letter-spacing: .06em;
  padding-bottom: 6px;
  border-bottom: 1.5px dashed #fecaca;
}
.proxy-panel-hint {
  font-size: .6rem; color: #94a3b8; text-align: center;
  line-height: 1.4;
}
.proxy-tag {
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, #fee2e2, #fecaca);
  border: 1px solid #fca5a5;
  border-radius: 8px; padding: 4px 6px;
  font-size: .78rem; font-weight: 800; color: #991b1b;
  gap: 4px;
}
.proxy-tag-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proxy-tag-remove {
  cursor: pointer; font-size: .9rem; line-height: 1;
  opacity: .6; flex-shrink: 0;
  transition: opacity .1s;
}
.proxy-tag-remove:hover { opacity: 1; }
.proxy-panel-empty {
  font-size: .62rem; color: #cbd5e1; text-align: center; padding: 4px 0;
}

/* ── 設定 Modal ── */
.settings-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 10000; display: flex; align-items: center; justify-content: center;
}
.settings-box {
  background: white; border-radius: 20px;
  box-shadow: 0 12px 60px rgba(0,0,0,.3);
  width: 640px; max-width: 95vw; max-height: 88vh;
  display: flex; flex-direction: column;
  font-family: 'Noto Sans TC', sans-serif;
  overflow: hidden;
}
.settings-header {
  background: linear-gradient(135deg, #ea580c, #f97316);
  padding: 16px 20px; display: flex; align-items: center; gap: 10px;
  color: white; flex-shrink: 0;
}
.settings-header h2 { font-size: 1.1rem; font-weight: 800; flex: 1; }
.settings-close {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.25); border: none; color: white;
  font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.settings-tabs {
  display: flex; border-bottom: 1.5px solid #f1f5f9;
  padding: 0 16px; background: #fafafa; flex-shrink: 0;
}
.settings-tab {
  padding: 10px 16px; font-size: .82rem; font-weight: 700;
  color: #94a3b8; cursor: pointer; border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px; transition: all .15s; white-space: nowrap;
}
.settings-tab.active { color: #ea580c; border-bottom-color: #ea580c; }
.settings-body { flex: 1; overflow-y: auto; padding: 20px; }
.settings-footer {
  padding: 12px 20px; border-top: 1.5px solid #f1f5f9;
  display: flex; gap: 8px; align-items: center; flex-shrink: 0;
  background: #fafafa;
}
.s-btn {
  padding: 8px 18px; border-radius: 10px; font-size: .82rem;
  font-weight: 700; cursor: pointer; border: none; transition: all .15s;
}
.s-btn-primary { background: linear-gradient(135deg,#f97316,#ea580c); color: white; }
.s-btn-primary:hover { opacity: .9; }
.s-btn-ghost { background: white; color: #64748b; border: 1.5px solid #e2e8f0; }
.s-btn-ghost:hover { background: #f8fafc; }
.s-btn-danger { background: white; color: #ef4444; border: 1.5px solid #fecaca; }
.s-btn-danger:hover { background: #fef2f2; }
.s-field { margin-bottom: 16px; }
.s-label { font-size: .75rem; font-weight: 700; color: #64748b; margin-bottom: 5px; display: block; }
.s-input {
  width: 100%; padding: 9px 12px; border: 1.5px solid #e2e8f0;
  border-radius: 9px; font-size: .9rem; font-family: inherit; outline: none;
  font-weight: 600; color: #1e293b; transition: border-color .15s;
}
.s-input:focus { border-color: #f97316; }
.s-hint { font-size: .68rem; color: #94a3b8; margin-top: 4px; line-height: 1.5; }
.s-section-title {
  font-size: .8rem; font-weight: 800; color: #f97316;
  margin: 18px 0 10px; letter-spacing: .04em;
  padding-bottom: 5px; border-bottom: 1.5px solid #ffedd5;
}
.member-table { width: 100%; border-collapse: collapse; }
.member-table th {
  font-size: .7rem; font-weight: 800; color: #64748b;
  padding: 5px 8px; text-align: left; border-bottom: 1.5px solid #f1f5f9;
}
.member-table td {
  padding: 4px 6px; border-bottom: 1px solid #f8fafc; vertical-align: middle;
}
.member-table td input {
  width: 100%; border: 1.5px solid transparent; border-radius: 6px;
  padding: 4px 7px; font-size: .8rem; font-family: inherit; font-weight: 600;
  background: transparent; outline: none; color: #1e293b;
}
.member-table td input:focus { border-color: #f97316; background: white; }
.member-table tr:hover td { background: #fffbf7; }
.member-del-btn {
  width: 22px; height: 22px; border-radius: 50%; border: none;
  background: #fee2e2; color: #ef4444; font-size: .75rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-weight: 900; transition: background .1s;
}
.member-del-btn:hover { background: #fecaca; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag-item {
  display: flex; align-items: center; gap: 4px;
  background: #f1f5f9; border: 1.5px solid #e2e8f0;
  border-radius: 20px; padding: 3px 10px;
  font-size: .78rem; font-weight: 700; color: #334155;
}
.tag-remove {
  cursor: pointer; font-size: .8rem; opacity: .6; line-height: 1;

<script>
// ══════════════════════════════════════════════
// ROSTER
// ══════════════════════════════════════════════
let ROSTER = [
  { name:"黃芯慧", role:"主席",      fix:"president" },
  { name:"劉家豪", role:"副主席",    fix:"vp"        },
  { name:"陳宜寧", role:"秘書/財務", fix:"secretary" },
  { name:"陳政華", role:"教育協調" }, { name:"王湘慈", role:"活動協調" },
  { name:"黃信樺", role:"成長協調" }, { name:"林彥合", role:"導師協調" },
  { name:"程韋銘", role:"來賓接待" },
  // 陳裔潔 固定在電音位，不進入隨機池
  { name:"劉兆矩", role:"會員委員" }, { name:"許文婉", role:"會員委員" },
  { name:"劉洛安", role:"會員委員" }, { name:"崔永疇", role:"會員委員" },
  { name:"劉峻嘉", role:"夥伴會員" }, { name:"簡廷桓", role:"夥伴會員" },
  { name:"曾郁婷", role:"夥伴會員" }, { name:"周宥達", role:"夥伴會員" },
  { name:"李惠暄", role:"夥伴會員" }, { name:"許祥泰", role:"夥伴會員" },
  { name:"廖翊如", role:"夥伴會員" }, { name:"譚宇芩", role:"夥伴會員" },
  { name:"李孟涵", role:"夥伴會員" }, { name:"楊尚恩", role:"夥伴會員" },
  { name:"周昆胤", role:"夥伴會員" }, { name:"李冠樺", role:"夥伴會員" },
];

// ══════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════
const MAX_GUESTS  = 12;
const MAX_MEMBERS = 40;
let   seatsPerSide = 3;   // 3 = 6人桌；2 = 4人桌
let   gridCols    = 2;   // 2 或 3 列桌子

// ══════════════════════════════════════════════
// CHAPTER — 分會資料（localStorage）
// ══════════════════════════════════════════════
const _chapterKey = new URLSearchParams(location.search).get('c') || 'default';
let   _chapterName = '長溙分會';

function _storageKey() { return 'bni_chapter_' + _chapterKey; }

function saveChapter() {
  const data = {
    name: _chapterName,
    roster: ROSTER,
    specialData: _specialData,
    pinnedOfficers: PINNED_OFFICERS,
    micMembers: MIC_MEMBERS,
    honorMembers: _honorMembers,
    infoSeats: _infoSeats,
  };
  localStorage.setItem(_storageKey(), JSON.stringify(data));
}

function loadChapter() {
  // 若 URL 有指定分會代號且不是 'default'，預設用代號當名稱
  if (_chapterKey !== 'default') _chapterName = _chapterKey;
  const raw = localStorage.getItem(_storageKey());
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d.name)          _chapterName    = d.name;
    if (d.roster)        ROSTER          = d.roster;
    if (d.specialData)   _specialData    = d.specialData;
    if (d.pinnedOfficers) PINNED_OFFICERS = d.pinnedOfficers;
    if (d.micMembers)    MIC_MEMBERS     = d.micMembers;
    if (d.honorMembers)  _honorMembers   = d.honorMembers;
    if (d.infoSeats)     _infoSeats      = d.infoSeats;
  } catch(e) { console.warn('loadChapter error', e); }
}

function applyChapterUI() {
  document.getElementById('chapterTitle').textContent = _chapterName + ' 例會座位表';
}

// ══════════════════════════════════════════════
// GUEST SLOT FORMULA（依 PPTX 圖片）
//
// 欄型交替：
//   A 型欄：[來賓, 夥伴, 來賓]  ← 頂底來賓，中間永遠夥伴
//   B 型欄：[夥伴, 來賓, 夥伴]  ← 只有中間來賓，頂底永遠夥伴
//
// 每排（左桌+右桌）分配：
//   偶數排（0,2,...）：右桌左欄=A, 右桌右欄=B, 左桌右欄=A, 左桌左欄=全夥伴
//   奇數排（1,3,...）：右桌右欄=A, 右桌左欄=B, 左桌右欄=B, 左桌左欄=全夥伴
//
// 來賓編號順序（偶數排5個，奇數排4個）：
//   偶數排：G(n+1)=右桌L頂, G(n+2)=左桌R頂, G(n+3)=右桌R中,
//           G(n+4)=右桌L底, G(n+5)=左桌R底
//   奇數排：G(n+1)=右桌R頂, G(n+2)=右桌L中, G(n+3)=左桌R中,
//           G(n+4)=右桌R底
//
// 偶+奇 = 5+4 = 9 per 2-row block；12位上限需1.5 blocks
//
// 沒有來賓的位置自動填入夥伴（不顯示空框）
// ══════════════════════════════════════════════

// col slot values:
//  number  = guest slot（若 gNum <= guestCount 顯示來賓，否則填夥伴）
//  'fixed' = 永遠是夥伴（不會變來賓）
// 安全取來賓號：若超過上限則改為 'fixed'（永遠是夥伴）
function gs(n) { return n <= MAX_GUESTS ? n : 'fixed'; }

// ── 依桌型建立來賓槽位 ────────────────────────────────
// sps = seatsPerSide (3=6人桌 / 2=4人桌)
//
// 6人桌 (sps=3)：
//   A型欄 [G, 夥伴, G]  B型欄 [夥伴, G, 夥伴]
//   偶數排 5個來賓/排，奇數排 4個
//
// 4人桌 (sps=2)：
//   A型欄 [G, 夥伴]     B型欄 [夥伴, G]
//   每排固定 3個來賓（均等）
// ───────────────────────────────────────────────────
function buildGuestMap(numTables) {
  const sps = seatsPerSide;
  const empty = () => Array(sps).fill('fixed');
  const map = Array.from({ length: numTables }, () => ({ L: empty(), R: empty() }));

  let g = 1;
  const numRows = Math.ceil(numTables / 2);

  for (let r = 0; r < numRows && g <= MAX_GUESTS; r++) {
    const L = r * 2, R = r * 2 + 1;
    const even = (r % 2 === 0);

    if (sps === 3) {
      // ── 6人桌（3席/欄）──
      if (R >= numTables) {
        // 單桌：B型 L欄 + A型 R欄
        if (L < numTables) {
          map[L].L = ['fixed', gs(g+1), 'fixed'];
          map[L].R = [gs(g),   'fixed',  gs(g+2)];
        }
        g += 3;
      } else if (even) {
        if (R < numTables) { map[R].L = [gs(g), 'fixed', gs(g+3)]; map[R].R = ['fixed', gs(g+2), 'fixed']; }
        if (L < numTables) { map[L].R = [gs(g+1), 'fixed', gs(g+4)]; }
        g += 5;
      } else {
        if (R < numTables) { map[R].R = [gs(g), 'fixed', gs(g+3)]; map[R].L = ['fixed', gs(g+1), 'fixed']; }
        if (L < numTables) { map[L].R = ['fixed', gs(g+2), 'fixed']; }
        g += 4;
      }
    } else {
      // ── 4人桌（2席/欄）──
      // 統一模式（不分奇偶排），確保相鄰桌接縫永遠「夥伴-來賓」不會「來賓-來賓」：
      //   右桌 L欄=[G(頂),M(底)]  R欄=[M(頂),G(底)]  ← 對角線，每位來賓旁都有夥伴
      //   左桌 R欄=[G(頂),M(底)]
      //   接縫：上桌底部=M，下桌頂部=G → 來賓旁永遠有夥伴照顧
      if (R >= numTables) {
        if (L < numTables) { map[L].R = [gs(g), 'fixed']; }
        g += 1;
      } else {
        if (R < numTables) { map[R].L = [gs(g), 'fixed']; map[R].R = ['fixed', gs(g+2)]; }
        if (L < numTables) { map[L].R = [gs(g+1), 'fixed']; }
        g += 3;
      }
    }
  }
  return map;
}

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let guestCount  = 0;
let memberCount = 25;
let _guestMap   = [];
let _memberPool = [];
let _colData        = [];   // 目前所有桌子的座位資料（可互換）
let _selectedEl     = null; // 目前選取的 oval 元素
let _selectedProxy  = null; // 目前選取的代理人 { name, el }
// info-col 兩格資料（可與一般座位互換）
let _infoSeats  = [
  { name:'陳裔潔', role:'電音控制' },
  { name:'資訊',   role:'' },
];
// 確定代理人名單（name → seat object），排位時排除
let _proxySet = {};

// 幹部固定左欄功能
let _pinOfficers = false;
let PINNED_OFFICERS = ['陳政華','王湘慈','林彥合','黃信樺'];
let MIC_MEMBERS    = ['劉峻嘉','程韋銘']; // 傳麥手固定，不隨機

function togglePinOfficers() {
  _pinOfficers = !_pinOfficers;
  const btn = document.getElementById('btnPin');
  btn.classList.toggle('active', _pinOfficers);
  btn.textContent = _pinOfficers ? '📌 幹部固定 ✓' : '📌 幹部固定';
  shuffle();
}

// 幹部固定席（主席/副主席/秘財）＋電音控制 — 可標為代理空位
let _specialData = [
  { colId:'pres-L', name:'黃芯慧', role:'主席',        proxyRole:'代理主席',   empty:false },
  { colId:'off-L',  name:'劉家豪', role:'副主席',      proxyRole:'代理副主席', empty:false },
  { colId:'off-R',  name:'陳宜寧', role:'秘書/財務',   proxyRole:'代理秘財',   empty:false },
];

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function rand(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 董顧/大使 固定加入座位池（可改名）
// 傳麥手固定席（劉峻嘉/程韋銘，淺紫色，固定不隨機）
let _micSeats = [
  { name:'劉峻嘉', role:'傳麥手' },
  { name:'程韋銘', role:'傳麥手' },
];

function renderMicSeats() {
  const col = document.getElementById('mic-col');
  if (!col) return;
  col.innerHTML = _micSeats.map((seat, i) =>
    `<div class="oval-wrap">
      <div class="oval c-mic" ondblclick="editMicSeat(${i});event.stopPropagation()" title="雙擊編輯名字">
        <span class="n">${seat.name}</span>
        <span class="r">${seat.role !== '傳麥' ? seat.role : ''}</span>
      </div>
    </div>`
  ).join('');
}

function editMicSeat(i) {
  const seat = _micSeats[i];
  const name = prompt('傳麥手名字：', seat.name);
  if (name === null) return;
  const role = prompt('職稱（可空白）：', seat.role === '傳麥' ? '' : seat.role);
  _micSeats[i] = { name: name.trim() || seat.name, role: role?.trim() || '傳麥' };
  renderMicSeats();
}

let _honorMembers = [
  { name:'董顧', role:'榮譽' },
  { name:'大使', role:'榮譽' },
];

// 壓縮欄位：把空格往下推（人名往上靠）
function compactColumn(tIdx, side) {
  const col = _colData[tIdx][side];
  const filled = col.filter(s => s && !s._absent);
  const empties = Array(col.length - filled.length).fill(null);
  _colData[tIdx][side] = [...filled, ...empties];
}


// 重排：活躍成員（綠）在前左右均勻，代理（灰）補後面，空格最末
function pullUpSeats() {
  const lastT = _colData.length - 1;
  const honorNames = new Set(_honorMembers.map(h => h.name));
  // 固定格：有人且屬於來賓/固定幹部/董顧大使 → 不動
  // 注意：null 不是固定格，空格也可以被使用
  const isFixed = seat => seat && (seat._guest || seat._pinned || honorNames.has(seat.name));

  // 一般桌（非最後一桌）的所有非固定格
  const normalSlots = [];
  for (let t = 0; t < lastT; t++) {
    for (let p = 0; p < seatsPerSide; p++) {
      for (const s of ['L','R']) {
        if (!isFixed(_colData[t][s][p])) normalSlots.push({ t, s, p });
      }
    }
  }

  // 最後一桌的所有非固定格（空格也算，代理人才能填進去）
  const lastSlots = [];
  for (let p = 0; p < seatsPerSide; p++) {
    for (const s of ['L','R']) {
      if (!isFixed(_colData[lastT][s][p])) lastSlots.push({ t: lastT, s, p });
    }
  }

  const allSlots = [...normalSlots, ...lastSlots];

  // 收集所有可移動成員
  const all     = allSlots.map(({t,s,p}) => _colData[t][s][p]).filter(Boolean);
  const active  = all.filter(m => !_proxySet[m.name]);
  const proxies = all.filter(m =>  _proxySet[m.name]);

  // 清空所有非固定格
  for (const { t, s, p } of allSlots) _colData[t][s][p] = null;

  // 活躍成員從前往後填滿
  let ai = 0;
  for (const { t, s, p } of allSlots) {
    if (ai >= active.length) break;
    _colData[t][s][p] = active[ai++];
  }

  // 代理人只填最後一桌，優先右欄由下往上，再左欄由下往上
  const proxyTargets = [...lastSlots].sort((a, b) => {
    if (a.s !== b.s) return a.s === 'R' ? -1 : 1; // R 欄優先
    return b.p - a.p;                               // 下排優先
  });
  let pi = 0;
  for (const { t, s, p } of proxyTargets) {
    if (pi >= proxies.length) break;
    if (!_colData[t][s][p]) _colData[t][s][p] = proxies[pi++];
  }

  // 董顧/大使永遠最後壓在最後一桌右欄末尾（蓋過代理）
  placeHonorMembers();

  for (let t = 0; t < _colData.length; t++) redrawTableCard(t);
}

function markSpecialProxy(p) {
  const d = _specialData[p];

  _proxySet[d.name] = { name: d.name, role: d.role };

  // 找第一個空格插入（最後的桌子），讓 pullUpSeats 排到後面
  let placed = false;
  for (let t = _colData.length - 1; t >= 0 && !placed; t--) {
    for (const s of ['L', 'R']) {

          _colData[t][s][pos] = { name: d.name, role: d.role };

  pullUpSeats();
  renderSpecialSeats();
  renderProxyPanel();
}

  overlay.innerHTML = `<div style="background:white;border-radius:16px;padding:24px 28px;min-width:260px;box-shadow:0 8px 40px rgba(0,0,0,.25);font-family:'Noto Sans TC',sans-serif;">
    <div style="font-size:1rem;font-weight:800;color:#ea580c;margin-bottom:16px">✏️ 編輯幹部席</div>

    <input id="_sn" type="text" value="${d.name}" style="display:block;width:100%;margin:4px 0 12px;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:1rem;font-family:inherit;font-weight:700;outline:none;">
    <label style="font-size:.78rem;color:#64748b;font-weight:600">職稱</label>
    <input id="_sr" type="text" value="${d.role}" style="display:block;width:100%;margin:4px 0 20px;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.85rem;font-family:inherit;outline:none;">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button id="_sc" style="padding:8px 18px;border:1.5px solid #e2e8f0;border-radius:8px;background:white;cursor:pointer;font-size:.85rem;font-weight:700;color:#64748b">取消</button>
      <button id="_so" style="padding:8px 18px;border:none;border-radius:8px;background:linear-gradient(135deg,#f97316,#ea580c);color:white;cursor:pointer;font-size:.85rem;font-weight:700">確認</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const ni = overlay.querySelector('#_sn'); ni.focus(); ni.select();
  const commit = () => {
    _specialData[p].name = ni.value.trim() || d.name;
    _specialData[p].role = overlay.querySelector('#_sr').value.trim() || d.role;
    renderSpecialSeats();
    document.body.removeChild(overlay);

  overlay.querySelector('#_so').addEventListener('click', commit);

}

// ══════════════════════════════════════════════
// BUILD TABLE CONTENT
// For each table, build left & right columns (3 seats each)
// 規則：
//  - 'fixed' slot  → always a member from pool
//  - gNum slot     → guest if gNum<=guestCount, else member from pool
//  - 'member' slot → member from pool
// ══════════════════════════════════════════════
function buildTableCols(guestMap, shuffledPool, curGuestCount) {
  const numTables = guestMap.length;

  // Count member slots per table
  const slotCount = guestMap.map(tbl => {
    let n = 0;
    ['L','R'].forEach(side => tbl[side].forEach(slot => {
      if (slot === 'fixed') n++;
      else if (typeof slot === 'number' && slot > curGuestCount) n++;
    }));
    return n;
  });
  const totalSlots  = slotCount.reduce((a,b)=>a+b, 0);
  const totalMember = shuffledPool.length;

  // 前 (n-2) 桌貪心坐滿；最後兩桌平均分配剩餘人數
  let remaining = totalMember;
  const allotted = slotCount.map((slots, i) => {
    const leftTables = numTables - i;   // 還剩幾桌（含本桌）
    if (leftTables > 2) {
      // 貪心：盡量坐滿
      const take = Math.min(slots, remaining);
      remaining -= take;
      return take;
    } else {
      // 最後兩桌：平均分配剩餘
      const share = Math.ceil(remaining / leftTables);
      const take = Math.min(slots, share, remaining);
      remaining -= take;
      return take;
    }
  });

  let cursor = 0;
  return guestMap.map((tbl, idx) => {
    const mine = shuffledPool.slice(cursor, cursor + allotted[idx]);
    cursor += allotted[idx];

    // 先標記哪些位置需要夥伴（L/R 交錯，確保兩欄均勻分配）
    const lSeats = tbl.L.map(slot => {
      if (slot === 'fixed') return 'MEMBER';
      if (typeof slot === 'number') return slot <= curGuestCount ? {_guest:slot} : 'MEMBER';
      return null;
    });
    const rSeats = tbl.R.map(slot => {
      if (slot === 'fixed') return 'MEMBER';
      if (typeof slot === 'number') return slot <= curGuestCount ? {_guest:slot} : 'MEMBER';
      return null;
    });

    // 交錯收集需要夥伴的位置 (L0,R0,L1,R1,...)
    const toFill = [];
    for (let p = 0; p < seatsPerSide; p++) {
      if (lSeats[p] === 'MEMBER') toFill.push({side:'L', pos:p});
      if (p < rSeats.length && rSeats[p] === 'MEMBER') toFill.push({side:'R', pos:p});
    }

    // 依序填入夥伴
    toFill.forEach(({side, pos}, i) => {
      const target = side === 'L' ? lSeats : rSeats;
      target[pos] = i < mine.length ? mine[i] : null;
    });

    return { L: lSeats, R: rSeats };
  });
}

// 傳麥手固定在最後一桌左欄（劉峻嘉/程韋銘）
function placeMicMembers() {
  const lastT = _colData.length - 1;
  if (lastT < 0) return;
  const micSet = new Set(MIC_MEMBERS);

  // 先移除已存在的傳麥手
  for (let t = 0; t < _colData.length; t++)
    for (const s of ['L','R'])
      for (let p = 0; p < _colData[t][s].length; p++)
        if (_colData[t][s][p] && micSet.has(_colData[t][s][p].name))
          _colData[t][s][p] = null;

  const displaced = [];
  MIC_MEMBERS.forEach((name, i) => {
    const r = ROSTER.find(m => m.name === name);
    const seat = { name, role: r ? r.role : '', _mic: true };
    const p = i;
    if (p >= _colData[lastT].L.length) { displaced.push(seat); return; }
    const cur = _colData[lastT].L[p];
    if (cur && !cur._guest) displaced.push(cur);
    else if (cur && cur._guest) {
      // 把來賓移到右欄空格
      let moved = false;
      for (let rp = 0; rp < _colData[lastT].R.length && !moved; rp++)
        if (!_colData[lastT].R[rp]) { _colData[lastT].R[rp] = cur; moved = true; }
    }
    _colData[lastT].L[p] = seat;
  });

  for (let t = 0; t < _colData.length && displaced.length; t++)
    for (const s of ['L','R'])
      for (let p = 0; p < _colData[t][s].length && displaced.length; p++)
        if (!_colData[t][s][p]) _colData[t][s][p] = displaced.shift();
}

// 幹部固定：桌1左欄前3位、桌3左欄前2位
// 被覆蓋的人移到空格補位
function placePinnedOfficers() {
  if (!_colData.length) return;

  const pinnedSeats = PINNED_OFFICERS.map(name => {
    const r = ROSTER.find(m => m.name === name);
    return r ? { name: r.name, role: r.role, _pinned: true } : { name, role: '', _pinned: true };
  });

  // 動態產生候補桌：先取每列最左桌（index 0, gridCols, 2*gridCols...），
  // 不夠再依序加其他桌，確保桌子數量夠放5位幹部
  const tableOrder = [];
  for (let row = 0; row * gridCols < _colData.length; row++) {
    tableOrder.push(row * gridCols);
  }
  // 若最左欄不夠（桌子排數×seatsPerSide < 5），補入其他桌
  if (tableOrder.length * seatsPerSide < PINNED_OFFICERS.length) {
    for (let i = 0; i < _colData.length; i++) {
      if (!tableOrder.includes(i)) tableOrder.push(i);
      if (tableOrder.length * seatsPerSide >= PINNED_OFFICERS.length) break;
    }
  }

  // 先移除已存在的固定幹部（可能已在其他格）
  const pinnedNames = new Set(PINNED_OFFICERS);
  const displaced = [];
  for (let t = 0; t < _colData.length; t++) {
    for (const s of ['L','R']) {
      for (let p = 0; p < _colData[t][s].length; p++) {
        if (_colData[t][s][p] && pinnedNames.has(_colData[t][s][p].name)) {
          _colData[t][s][p] = null;
        }
      }
    }
  }

  // 依序為每位幹部找位置：來賓格移走再放幹部，一般成員收集到 displaced
  let officerIdx = 0;
  for (const tIdx of tableOrder) {
    if (officerIdx >= pinnedSeats.length) break;
    if (!_colData[tIdx]) continue;
    for (let p = 0; p < _colData[tIdx].L.length && officerIdx < pinnedSeats.length; p++) {
      const cur = _colData[tIdx].L[p];
      if (cur && cur._guest) {
        // 把來賓移到同桌右欄空格，或其他桌空格
        let moved = false;
        for (let rp = 0; rp < _colData[tIdx].R.length && !moved; rp++)
          if (!_colData[tIdx].R[rp]) { _colData[tIdx].R[rp] = cur; moved = true; }
        if (!moved)
          for (let t2 = 0; t2 < _colData.length && !moved; t2++)
            for (const s2 of ['R','L'])
              for (let p2 = 0; p2 < _colData[t2][s2].length && !moved; p2++)
                if (!_colData[t2][s2][p2]) { _colData[t2][s2][p2] = cur; moved = true; }
        _colData[tIdx].L[p] = null;
      } else if (cur) {
        displaced.push(cur); // 一般成員被擠走
      }
      _colData[tIdx].L[p] = pinnedSeats[officerIdx++];
    }
  }

  // 被擠走的人填到空格（從前往後找）
  for (let t = 0; t < _colData.length && displaced.length; t++) {
    for (const s of ['L','R']) {
      for (let p = 0; p < _colData[t][s].length && displaced.length; p++) {
        if (!_colData[t][s][p]) _colData[t][s][p] = displaced.shift();
      }
    }
  }
}

// 董顧/大使固定放在最後一桌右欄最後兩個位置
// 若目標格已有成員，先收集被擠走的人再安置到空格
function placeHonorMembers() {
  const lastT = _colData.length - 1;
  if (lastT < 0) return;
  const rLen = _colData[lastT].R.length;
  const honorNames = new Set(_honorMembers.map(h => h.name));

  // 先移除已存在的董顧/大使（避免重複）
  for (let t = 0; t < _colData.length; t++) {
    for (const s of ['L','R']) {
      for (let p = 0; p < _colData[t][s].length; p++) {
        if (_colData[t][s][p] && honorNames.has(_colData[t][s][p].name)) {
          _colData[t][s][p] = null;
        }
      }
    }
  }

  // 放到最後一桌右欄末尾，若有人被擠走先收集
  const displaced = [];
  _honorMembers.forEach((h, i) => {
    const pos = rLen - 1 - i;
    if (pos < 0) return;
    const cur = _colData[lastT].R[pos];
    if (cur && !cur._guest && !honorNames.has(cur.name)) displaced.push(cur);
    _colData[lastT].R[pos] = { name: h.name, role: h.role };
  });

  // 被擠走的人找空格安置（從第一桌開始找）
  for (let t = 0; t < _colData.length && displaced.length; t++) {
    for (const s of ['L','R']) {
      for (let p = 0; p < _colData[t][s].length && displaced.length; p++) {
        if (!_colData[t][s][p]) _colData[t][s][p] = displaced.shift();
      }
    }
  }
}

function renderCol(colSeats, tIdx, side) {
  return colSeats.map((seat, p) => {
    if (!seat)           return emptySlotOval(tIdx, side, p);
    if (seat._absent)    return absentOval(tIdx, side, p);
    if (seat._guest)     return guestOval(seat._guest, tIdx, side, p);
    if (_proxySet[seat.name]) return mkProxyMemberOval(seat, tIdx, side, p); // 灰色代理
    const micSet = new Set(MIC_MEMBERS);
    const cls = micSet.has(seat.name) ? 'c-mic' : seat._pinned ? 'c-pinned' : seat.role === '榮譽' ? 'c-orange' : 'c-member';
    return mkOval(cls, seat.name, seat.role, tIdx, side, p);
  }).join('');
}

function colHeight(colSeats) {
  const n = colSeats.filter(s => s).length;
  if (n <= 2) return 'sz-sm';
  return 'sz-md';
}

function rectSize() {
  const oH = 48 + 4;  // oval高+gap
  return seatsPerSide * oH - 4;
}

function renderTable(num, colData) {
  const h = rectSize();
  const w = seatsPerSide === 2 ? 108 : 128;
  const idx = num - 1;  // 0-based index for data attributes
  return `<div class="table-card" data-t="${num}">
    <div class="table-card-label">桌 ${num}</div>
    <div class="table-inner">
      <div class="t-col">${renderCol(colData.L, idx, 'L')}</div>
      <div class="table-rect" style="width:${w}px;height:${h}px"></div>
      <div class="t-col">${renderCol(colData.R, idx, 'R')}</div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════
// CALCULATE TABLE COUNT
// 用實際來賓數；桌數永遠是偶數（左右成對顯示）
// ══════════════════════════════════════════════
function calcNumTables(poolSize) {
  const seats = seatsPerSide * 2;
  let n = Math.max(2, Math.ceil((poolSize + guestCount) / seats));
  if (n % 2 !== 0) n++;   // 湊偶數：讓每排都有左右兩桌
  return n;
}

// ══════════════════════════════════════════════
// MAIN SHUFFLE
// ══════════════════════════════════════════════
function shuffle() {
  const cap  = Math.min(memberCount, ROSTER.length);
  const allBase = ROSTER.filter(m => !m.fix).slice(0, cap - 3);

  // 傳麥手 + 固定幹部先從隨機池移除
  const micSet    = new Set(MIC_MEMBERS);
  const pinnedSet = _pinOfficers ? new Set(PINNED_OFFICERS) : new Set();
  _memberPool = rand(allBase.filter(m => !pinnedSet.has(m.name) && !micSet.has(m.name)));

  // 計算桌數時把固定人數算進去
  const fixedCount = (_pinOfficers ? PINNED_OFFICERS.length : 0) + MIC_MEMBERS.length;
  const totalForLayout = _memberPool.length + fixedCount;
  const numTables = calcNumTables(totalForLayout);

  _guestMap = buildGuestMap(numTables);
  _colData = buildTableCols(_guestMap, _memberPool, guestCount);
  placeMicMembers();              // 傳麥手固定在最後一桌左欄
  placeHonorMembers();            // 董顧/大使固定右下角
  if (_pinOfficers) placePinnedOfficers(); // 固定幹部填入保留格
  _selectedEl = null;

  // 幹部席（含代理功能）+ 傳麥手
  document.getElementById('pres-R').innerHTML = '';
  renderSpecialSeats();
  renderMicSeats();

  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = _colData.map((c, i) => renderTable(i + 1, c)).join('');
  grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  // 重新排列後，把代理幹部重新插入 _colData（否則會消失）
  _specialData.forEach(d => {
    if (!d.empty) return; // 未代理，略過
    _proxySet[d.name] = { name: d.name, role: d.role }; // 確保還在代理集
    let placed = false;
    for (let t = _colData.length - 1; t >= 0 && !placed; t--) {
      for (const s of ['L','R']) {
        for (let pos = _colData[t][s].length - 1; pos >= 0 && !placed; pos--) {
          if (!_colData[t][s][pos] || _colData[t][s][pos]._absent) {
            _colData[t][s][pos] = { name: d.name, role: d.role };
            placed = true;
          }
        }
      }
    }
  });
  if (Object.keys(_proxySet).length) pullUpSeats(); // 代理人推到後面
  renderProxyPanel();

  const now = new Date();
  const session = document.getElementById('sessionInput')?.value || '13';
  document.getElementById('weekChip').textContent =
    `${now.getFullYear()}年`;
}

// ══════════════════════════════════════════════
// UPDATE GUESTS — 重新計算桌數讓桌子坐滿
// ══════════════════════════════════════════════
function updateGuestsOnly(val) {
  guestCount = val;
  document.getElementById('guestBadge').textContent = val;

  // 來賓數影響桌數，需重新建立 guestMap
  const fixedCount2 = (_pinOfficers ? PINNED_OFFICERS.length : 0) + MIC_MEMBERS.length;
  const totalForLayout = _memberPool.length + fixedCount2;
  const numTables = calcNumTables(totalForLayout);
  _guestMap = buildGuestMap(numTables);
  _colData = buildTableCols(_guestMap, _memberPool, guestCount);
  _selectedEl = null;

  placeMicMembers();
  placeHonorMembers();
  if (_pinOfficers) placePinnedOfficers();

  if (Object.keys(_proxySet).length) pullUpSeats();

  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = _colData.map((c, i) => renderTable(i + 1, c)).join('');
  grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  renderProxyPanel();
}

// 指定位置：點擊互換（支援 info-col ↔ 一般座位）
// ══════════════════════════════════════════════
function getSeat(t, s, p) {
  if (t === -1) return _infoSeats[p]; // info oval
  return _colData[t][s][p];
}
function setSeat(t, s, p, val) {
  if (t === -1) { _infoSeats[p] = val; redrawInfoOval(p); }
  else { _colData[t][s][p] = val; redrawTableCard(t); }
}
function redrawTableCard(tIdx) {
  const card = document.querySelector(`#tablesGrid .table-card:nth-child(${tIdx + 1})`);
  if (!card) return;
  const cols = card.querySelectorAll('.t-col');
  if (cols[0]) cols[0].innerHTML = renderCol(_colData[tIdx].L, tIdx, 'L');
  if (cols[1]) cols[1].innerHTML = renderCol(_colData[tIdx].R, tIdx, 'R');
}
function redrawInfoOval(p) {
  const el = document.getElementById(`infoOval${p}`);
  if (!el) return;
  const seat = _infoSeats[p];
  const name = seat ? (seat.name || '') : '';
  const role = seat ? (seat.role || '') : '';
  el.querySelector('.oval-name').textContent = name;
  el.querySelector('.oval-sub').textContent  = role;
  el.querySelector('.oval-name').style.fontSize = name.length > 4 ? '.82rem' : '1rem';
}

function seatClick(el) {
  if (!_selectedEl) {
    _selectedEl = el;
    el.classList.add('selected');
    return;
  }
  if (_selectedEl === el) {
    el.classList.remove('selected');
    _selectedEl = null;
    return;
  }
  const t1 = +_selectedEl.dataset.t, s1 = _selectedEl.dataset.s, p1 = +_selectedEl.dataset.p;
  const t2 = +el.dataset.t,          s2 = el.dataset.s,          p2 = +el.dataset.p;

  // 取得兩邊座位資料（null = 空格）
  const getSeatData = (t, s, p) => {
    if (t === -1) return _infoSeats[p] ? {..._infoSeats[p]} : null;
    if (t === -3) {
      const d = _specialData[p];
      return d.empty ? null : { name: d.name, role: d.role };
    }
    return _colData[t][s][p] ?? null;
  };
  const seat1 = getSeatData(t1, s1, p1);
  const seat2 = getSeatData(t2, s2, p2);

  // 寫回
  const writeSeat = (t, s, p, val) => {
    if (t === -1) { _infoSeats[p] = val || { name:'', role:'' }; redrawInfoOval(p); }
    else if (t === -3) {
      const d = _specialData[p];
      if (val) {
        d.name  = val.name;
        d.role  = d.proxyRole; // 放入的人一律顯示代理職稱（雙擊可改）
        d.empty = false;
      } else {
        d.empty = true;
      }
      renderSpecialSeats();
    }
    else { _colData[t][s][p] = val; redrawTableCard(t); }
  };
  writeSeat(t1, s1, p1, seat2);
  writeSeat(t2, s2, p2, seat1);

  _selectedEl.classList.remove('selected');
  _selectedEl = null;
}

// 成員選擇器（空格點擊後下拉選人）
// ══════════════════════════════════════════════
let _pickerTarget = null; // { t, s, p }

function showMemberPicker(t, s, p, anchorEl) {
  _pickerTarget = { t, s, p };
  const picker = document.getElementById('memberPicker');

  // 計算已上座的人名
  const seated = new Set();
  for (let ti = 0; ti < _colData.length; ti++) {
    for (const si of ['L','R']) {
      for (const seat of _colData[ti][si]) {
        if (seat && seat.name) seated.add(seat.name);
      }
    }
  }
  _infoSeats.forEach(s => s && s.name && seated.add(s.name));
  _specialData.forEach(d => !d.empty && seated.add(d.name));

  // 可選成員：ROSTER 全部（含董顧/大使）未落座者
  const available = [
    ...ROSTER.filter(m => !seated.has(m.name)),
    ..._honorMembers.filter(m => !seated.has(m.name)),
  ];

  if (!available.length) {
    picker.style.display = 'none';
    return;
  }

  picker.innerHTML =
    `<div class="mp-title">選擇成員</div>` +
    available.map(m =>
      `<div class="mp-item" onclick="pickMember('${m.name}','${m.role||''}')">
        <span>${m.name}</span>
        <span class="mp-role">${m.role||''}</span>
      </div>`
    ).join('') +
    `<div class="mp-cancel" onclick="closePicker()">取消</div>`;

  // 定位到錨點旁邊
  const rect = anchorEl.getBoundingClientRect();
  picker.style.display = 'flex';
  picker.style.left = Math.min(rect.left, window.innerWidth - 180) + 'px';
  picker.style.top  = (rect.bottom + 6) + 'px';
}

function pickMember(name, role) {
  if (!_pickerTarget) return;
  const { t, s, p } = _pickerTarget;
  const r = ROSTER.find(m => m.name === name) || { name, role };
  _colData[t][s][p] = { name: r.name, role: r.role };
  redrawTableCard(t);
  closePicker();
}

function closePicker() {
  document.getElementById('memberPicker').style.display = 'none';
  _pickerTarget = null;
}

// 點擊其他地方關閉
document.addEventListener('click', e => {
  const picker = document.getElementById('memberPicker');
  if (picker && !picker.contains(e.target) && !e.target.closest('.c-slot-empty')) {
    closePicker();

});

function seatRemoveByCoord(t, s, p) {
  if (_selectedEl)    { _selectedEl.classList.remove('selected'); _selectedEl = null; }
  if (_selectedProxy) { _selectedProxy.el.classList.remove('selected'); _selectedProxy = null; }
  if (t < 0) return;
  const seat = _colData[t][s][p];
  if (!seat || seat._absent || seat._guest) return;
  _proxySet[seat.name] = seat; // 標記為代理（灰色），不移除
  pullUpSeats();               // 重排：活躍在前、代理在後
  renderProxyPanel();
}
// 純刪除：清空格子（不進代理名單）
function seatDeleteByCoord(t, s, p) {
  if (_selectedEl)    { _selectedEl.classList.remove('selected'); _selectedEl = null; }
  if (_selectedProxy) { _selectedProxy.el.classList.remove('selected'); _selectedProxy = null; }
  if (t < 0) return;
  const seat = _colData[t][s][p];
  if (!seat || seat._absent || seat._guest) return;
  _colData[t][s][p] = null;
  pullUpSeats();
}
// 舊版 seatRemove（右鍵備用）
function seatRemove(el) { seatRemoveByCoord(+el.dataset.t, el.dataset.s, +el.dataset.p); }


function renderProxyPanel() {
  const list  = document.getElementById('proxyList');
  const hint  = document.querySelector('.proxy-panel-hint');
  const names = Object.keys(_proxySet);
  if (!names.length) {
    list.innerHTML = '<div class="proxy-panel-empty">尚無代理</div>';
    if (hint) hint.style.display = '';
  } else {
    if (hint) hint.style.display = 'none';
    list.innerHTML = names.map(name => `
      <div class="proxy-tag">
        <span class="proxy-tag-name">${name}</span>
        <span class="proxy-tag-remove" onclick="restoreProxy('${name}')" title="還原為出席（變回綠色）">✓</span>
      </div>
    `).join('');
  }
}

function restoreProxy(name) {
  delete _proxySet[name];
  if (_selectedProxy && _selectedProxy.name === name) _selectedProxy = null;

  // 若是幹部 → 從 _colData 移除、還原幹部席位
  const si = _specialData.findIndex(d => d.name === name && d.empty);
  if (si >= 0) {
    for (let t = 0; t < _colData.length; t++) {
      for (const s of ['L','R']) {
        for (let pos = 0; pos < _colData[t][s].length; pos++) {
          if (_colData[t][s][pos] && _colData[t][s][pos].name === name) {
            _colData[t][s][pos] = null;
          }
        }
      }
    }
    _specialData[si].empty = false;
    renderSpecialSeats();
  }

  pullUpSeats();
  renderProxyPanel();
}

function editInfoOval(el) {
  const nameEl = el.querySelector('.oval-name');
  const subEl  = el.querySelector('.oval-sub');
  const currentName = nameEl.textContent.trim();
  const currentSub  = subEl.textContent.trim();

  // 建立浮動編輯層

  overlay.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;
    display:flex;align-items:center;justify-content:center;
  `;

  overlay.innerHTML = `
    <div style="background:white;border-radius:16px;padding:24px 28px;min-width:260px;
                box-shadow:0 8px 40px rgba(0,0,0,.25);font-family:'Noto Sans TC',sans-serif;">
      <div style="font-size:1rem;font-weight:800;color:#ea580c;margin-bottom:16px">✏️ 編輯名稱</div>
      <label style="font-size:.78rem;color:#64748b;font-weight:600">姓名</label>
      <input id="_edit_name" type="text" value="${currentName}"
        style="display:block;width:100%;margin:4px 0 12px;padding:8px 12px;
               border:1.5px solid #e2e8f0;border-radius:8px;font-size:1rem;
               font-family:inherit;outline:none;font-weight:700;" />
      <label style="font-size:.78rem;color:#64748b;font-weight:600">備注（可留空）</label>
      <input id="_edit_sub" type="text" value="${currentSub}"
        style="display:block;width:100%;margin:4px 0 20px;padding:8px 12px;
               border:1.5px solid #e2e8f0;border-radius:8px;font-size:.85rem;
               font-family:inherit;outline:none;" />
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button id="_edit_cancel"
          style="padding:8px 18px;border:1.5px solid #e2e8f0;border-radius:8px;
                 background:white;cursor:pointer;font-size:.85rem;font-weight:700;color:#64748b">取消</button>
        <button id="_edit_ok"
          style="padding:8px 18px;border:none;border-radius:8px;
                 background:linear-gradient(135deg,#f97316,#ea580c);
                 color:white;cursor:pointer;font-size:.85rem;font-weight:700">確認</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  const nameInput = overlay.querySelector('#_edit_name');
  const subInput  = overlay.querySelector('#_edit_sub');
  nameInput.focus(); nameInput.select();

  const commit = () => {
    const n = nameInput.value.trim() || currentName;
    const s = subInput.value.trim();
    nameEl.textContent = n;
    subEl.textContent  = s;
    nameEl.style.fontSize = n.length > 4 ? '.82rem' : '1rem';
    // 若是 info-col oval，同步更新 _infoSeats
    const p = el.dataset.p;
    if (el.dataset.t === '-1' && p !== undefined) {
      _infoSeats[+p] = { name: n, role: s };
    }
    document.body.removeChild(overlay);
  };
  const cancel = () => document.body.removeChild(overlay);

  overlay.querySelector('#_edit_ok').addEventListener('click', commit);
  overlay.querySelector('#_edit_cancel').addEventListener('click', cancel);
  overlay.addEventListener('click', e => { if (e.target === overlay) cancel(); });
  overlay.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') cancel();
  });
}

// 匯出 PPT
// ══════════════════════════════════════════════
async function exportPPT() {
  const btn = document.getElementById('btnPPT');
  btn.textContent = '⏳ 產生中…'; btn.disabled = true;

  // 1. 隱藏控制列 & 圖例 & 確定代理面板（PPT 不需要顯示）
  const topbar     = document.querySelector('.topbar');
  const legend     = document.querySelector('.legend');
  const proxyPanel = document.getElementById('proxyPanel');
  topbar.style.display     = 'none';
  legend.style.display     = 'none';
  proxyPanel.style.display = 'none';
  await new Promise(r => setTimeout(r, 60));

  // 2. 建立 PPT 規格，計算截圖目標尺寸
  const now     = new Date();
  const session = document.getElementById('sessionInput')?.value || '13';
  const dateStr = `${now.getFullYear()}年 第${session}會期`;

  const pptx  = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';
  const SW = 13.3333, SH = 7.5;
  const HDR = 0.80;   // 標題列高度（英寸）

  // PPT 內容區長寬比 → 以此為截圖目標比例，讓圖片填滿投影片
  const PPT_AR = SW / (SH - HDR); // ≈ 2.0

  // 先以預設寬度渲染，取得內容高度
  const EXPORT_W = 1800;
  const prevW   = document.body.style.width;
  const prevMin = document.body.style.minWidth;
  document.body.style.width    = EXPORT_W + 'px';
  document.body.style.minWidth = EXPORT_W + 'px';
  await new Promise(r => setTimeout(r, 100));

  const capH = document.body.scrollHeight;
  // 若內容比 PPT 比例更高，就加寬截圖讓同樣內容縮小更少
  const targetW = Math.max(EXPORT_W, Math.round(capH * PPT_AR));
  document.body.style.width    = targetW + 'px';
  document.body.style.minWidth = targetW + 'px';
  await new Promise(r => setTimeout(r, 80));

  const finalH = document.body.scrollHeight;
  const canvas = await html2canvas(document.body, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#f8fafc',
    width: targetW, height: finalH,
    windowWidth: targetW, windowHeight: finalH,
    scrollX: 0, scrollY: 0,
  });

  // 3. 還原頁面
  document.body.style.width    = prevW;
  document.body.style.minWidth = prevMin;
  topbar.style.display     = '';
  legend.style.display     = '';
  proxyPanel.style.display = '';

  const imgData = canvas.toDataURL('image/png');

  // 4. 建立投影片
  const slide = pptx.addSlide();

  // ── 橘色標題列 ──
  slide.addShape(pptx.ShapeType.rect, {
    x: 0, y: 0, w: SW, h: HDR,
    fill: { color: 'EA580C' }, line: { color: 'EA580C' },
  });

  // ── 標題文字（左）──
  slide.addText(_chapterName + '　例會座位表', {
    x: 0.25, y: 0, w: 7.0, h: HDR,
    fontSize: 32, bold: true, color: 'FFFFFF',
    fontFace: 'Microsoft JhengHei', valign: 'middle',
  });

  // ── 日期資訊 + 接待組謹制（右）──
  slide.addText(`${dateStr}　　接待組 謹制`, {
    x: 7.4, y: 0, w: SW - 7.4 - 0.2, h: HDR,
    fontSize: 18, color: 'FFE0C8',
    fontFace: 'Microsoft JhengHei', valign: 'middle', align: 'right',
  });

  // ── 座位圖：填滿標題列以下全部空間 ──
  // 圖像填滿整個標題列以下空間（不留邊距）
  slide.addImage({ data: imgData, x: 0, y: HDR, w: SW, h: SH - HDR });

  // 5. 匯出
  const fname = `BNI${_chapterName}座位圖_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.pptx`;
  await pptx.writeFile({ fileName: fname });
  btn.textContent = '📊 匯出PPT'; btn.disabled = false;
}

// ── Tab 1: 會員名單 ────────────────────────────
function _tabMembers() {
  const rows = ROSTER.map((m, i) =>
    `<tr data-i="${i}">
      <td><input value="${_esc(m.name)}" data-field="name" data-i="${i}" onchange="_rosterEdit(${i},'name',this.value)"></td>
      <td><input value="${_esc(m.role)}" data-field="role" data-i="${i}" onchange="_rosterEdit(${i},'role',this.value)"></td>
      <td style="width:32px;text-align:center">
        <button class="member-del-btn" onclick="_rosterDel(${i})" title="刪除">✕</button>
      </td>
    </tr>`
  ).join('');
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:.8rem;color:#64748b;font-weight:600">共 ${ROSTER.length} 位會員</span>
      <button class="s-btn s-btn-primary" onclick="_rosterAdd()" style="padding:5px 14px;font-size:.78rem">＋ 新增</button>
    </div>
    <table class="member-table" id="rosterTable">
      <thead><tr><th>姓名</th><th>職稱</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="s-hint" style="margin-top:10px">
      ※ 主席/副主席/秘財 在「幹部設定」頁面修改。<br>
      ※ 電音控制固定席位（陳裔潔）請直接在頁面上雙擊編輯。
    </div>`;
}

function _rosterEdit(i, field, val) { ROSTER[i][field] = val.trim(); }

function _rosterDel(i) {
  if (!confirm(`確定刪除 ${ROSTER[i].name}？`)) return;
  ROSTER.splice(i, 1);
  switchSettingsTab(1);
}

function _rosterAdd() {
  ROSTER.push({ name: '新會員', role: '夥伴會員' });
  switchSettingsTab(1);
  // 捲到最底讓使用者看到新增的項目
  setTimeout(() => {
    const body = document.getElementById('settingsBody');
    if (body) body.scrollTop = body.scrollHeight;
  }, 50);
}

// ── Tab 2: 幹部設定 ────────────────────────────
function _tabOfficers() {
  const pinnedTags = PINNED_OFFICERS.map((n,i) =>
    `<div class="tag-item">${_esc(n)}<span class="tag-remove" onclick="_pinnedDel(${i})">✕</span></div>`
  ).join('');
  const micTags = MIC_MEMBERS.map((n,i) =>
    `<div class="tag-item">${_esc(n)}<span class="tag-remove" onclick="_micDel(${i})">✕</span></div>`
  ).join('');
  const honorRows = _honorMembers.map((h,i) =>
    `<div style="display:flex;gap:8px;margin-bottom:6px">
      <input class="s-input" value="${_esc(h.name)}" onchange="_honorEdit(${i},'name',this.value)" style="flex:2">
      <input class="s-input" value="${_esc(h.role)}" onchange="_honorEdit(${i},'role',this.value)" placeholder="職稱" style="flex:1">
    </div>`
  ).join('');
  return `
    <div class="s-section-title">👑 固定幹部席（主席 / 副主席 / 秘財）</div>
    ${_specialData.map((d,i) => `
      <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
        <span style="font-size:.72rem;color:#94a3b8;width:70px;flex-shrink:0">${d.proxyRole.replace('代理','')}</span>
        <input class="s-input" value="${_esc(d.name)}" onchange="_specialEdit(${i},'name',this.value)" style="flex:2">
        <input class="s-input" value="${_esc(d.role)}" onchange="_specialEdit(${i},'role',this.value)" style="flex:1.5">
      </div>`).join('')}

    <div class="s-section-title">📌 固定幹部（左欄，深綠色）</div>
    <div class="tag-list" id="pinnedTagList">${pinnedTags}</div>
    <div class="tag-add-row">
      <input id="s_pinnedInput" placeholder="輸入姓名後按 ＋">
      <button class="s-btn s-btn-ghost" onclick="_pinnedAdd()" style="padding:6px 14px">＋</button>
    </div>
    <div class="s-hint">順序即為固定位置順序（由上到下）。請確認此人也在會員名單中。</div>

    <div class="s-section-title">🎤 傳麥手（淺紫色，固定不隨機）</div>
    <div class="tag-list" id="micTagList">${micTags}</div>
    <div class="tag-add-row">
      <input id="s_micInput" placeholder="輸入姓名後按 ＋">
      <button class="s-btn s-btn-ghost" onclick="_micAdd()" style="padding:6px 14px">＋</button>
    </div>

    <div class="s-section-title">🏅 榮譽席（董顧 / 大使，右下角紅色）</div>
    ${honorRows}`;
}

function _specialEdit(i, field, val) { _specialData[i][field] = val.trim(); }
function _honorEdit(i, field, val)   { _honorMembers[i][field] = val.trim(); }

function _pinnedDel(i) {
  PINNED_OFFICERS.splice(i, 1);
  document.getElementById('pinnedTagList').innerHTML =
    PINNED_OFFICERS.map((n,j) =>
      `<div class="tag-item">${_esc(n)}<span class="tag-remove" onclick="_pinnedDel(${j})">✕</span></div>`
    ).join('');
}
function _pinnedAdd() {
  const inp = document.getElementById('s_pinnedInput');
  const n = inp.value.trim();
  if (!n) return;
  PINNED_OFFICERS.push(n);
  inp.value = '';
  document.getElementById('pinnedTagList').innerHTML =
    PINNED_OFFICERS.map((nm,j) =>
      `<div class="tag-item">${_esc(nm)}<span class="tag-remove" onclick="_pinnedDel(${j})">✕</span></div>`
    ).join('');
}
function _micDel(i) {
  MIC_MEMBERS.splice(i, 1);
  document.getElementById('micTagList').innerHTML =
    MIC_MEMBERS.map((n,j) =>
      `<div class="tag-item">${_esc(n)}<span class="tag-remove" onclick="_micDel(${j})">✕</span></div>`
    ).join('');
}
function _micAdd() {
  const inp = document.getElementById('s_micInput');
  const n = inp.value.trim();
  if (!n) return;
  MIC_MEMBERS.push(n);
  inp.value = '';
  document.getElementById('micTagList').innerHTML =
    MIC_MEMBERS.map((nm,j) =>
      `<div class="tag-item">${_esc(nm)}<span class="tag-remove" onclick="_micDel(${j})">✕</span></div>`
    ).join('');
}

// ── 儲存 ──────────────────────────────────────
function _saveSettings() {
  // 讀取分會名稱
  const nameInput = document.getElementById('s_chapterName');
  if (nameInput) _chapterName = nameInput.value.trim() || _chapterName;

  saveChapter();
  applyChapterUI();
  closeSettings();
  renderSpecialSeats();
  renderMicSeats();
  shuffle();
}

// ── 匯出/匯入 JSON ──────────────────────────────
function _exportJSON() {
  const data = {
    chapterKey: _chapterKey,
    name: _chapterName,
    roster: ROSTER,
    specialData: _specialData,
    pinnedOfficers: PINNED_OFFICERS,
    micMembers: MIC_MEMBERS,
    honorMembers: _honorMembers,
    infoSeats: _infoSeats,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `BNI_${_chapterName}_設定.json`;
  a.click(); URL.revokeObjectURL(url);
}

function _importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.name)           _chapterName    = d.name;
        if (d.roster)         ROSTER          = d.roster;
        if (d.specialData)    _specialData    = d.specialData;
        if (d.pinnedOfficers) PINNED_OFFICERS = d.pinnedOfficers;
        if (d.micMembers)     MIC_MEMBERS     = d.micMembers;
        if (d.honorMembers)   _honorMembers   = d.honorMembers;
        if (d.infoSeats)      _infoSeats      = d.infoSeats;
        saveChapter();
        applyChapterUI();
        closeSettings();
        renderSpecialSeats();
        renderMicSeats();
        shuffle();
        alert('匯入成功！');
      } catch(err) { alert('匯入失敗：' + err.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function _esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
</script>
</body>
</html>
